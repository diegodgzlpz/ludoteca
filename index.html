<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ludoteca de Diego y Alba</title>
<meta name="description" content="Colección de juegos de mesa de Diego y Alba, con filtro por número de jugadores, tiempo y edad.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_ES">
<meta property="og:title" content="Ludoteca de Diego y Alba">
<meta property="og:description" content="Nuestros juegos de mesa: filtra por jugadores, tiempo y edad, y mira cómo se juega cada uno.">
<meta property="og:url" content="https://diegodgzlpz.github.io/ludoteca/">
<meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%23181715'/%3E%3Cg fill='%23cc785c'%3E%3Ccircle cx='21' cy='21' r='5'/%3E%3Ccircle cx='43' cy='21' r='5'/%3E%3Ccircle cx='32' cy='32' r='5'/%3E%3Ccircle cx='21' cy='43' r='5'/%3E%3Ccircle cx='43' cy='43' r='5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Estilo editorial cálido (DESIGN.md): lienzo crema, títulos serif, acento coral, panel de filtros oscuro */
:root{
  --paper:#f5f0e8; --surface:#faf9f5; --sunk:#efe9de; --cover-bg:#ffffff;
  --ink:#141413; --muted:#6c6a64; --line:#e6dfd8;
  --accent:#cc785c; --accent-ink:#9c4f36; --btn:#a9583e; --btn-press:#8f4630; --btn-ink:#ffffff;
  --panel:#181715; --panel-ink:#faf9f5; --panel-soft:#a09d96; --panel-line:#3a3833; --panel-field:#252320;
  --chip-on:#cc785c; --chip-on-ink:#141413;
  --foot:#181715; --foot-ink:#a09d96; --foot-link:#faf9f5;
  --display:"Source Serif 4","Tiempos Headline",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --lift:0 1px 3px rgba(20,20,19,.08),0 10px 24px -14px rgba(20,20,19,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141413; --surface:#1f1e1b; --sunk:#2a2824; --cover-bg:#1f1e1b;
  --ink:#faf9f5; --muted:#a09d96; --line:#34322d;
  --accent:#d98a6f; --accent-ink:#e39a80; --btn:#d98a6f; --btn-press:#e5a48c; --btn-ink:#141413;
  --panel:#252320; --panel-line:#45423b; --panel-field:#1a1917;
  --chip-on:#d98a6f; --foot:#1f1e1b;
  --lift:0 1px 3px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141413; --surface:#1f1e1b; --sunk:#2a2824; --cover-bg:#1f1e1b;
  --ink:#faf9f5; --muted:#a09d96; --line:#34322d;
  --accent:#d98a6f; --accent-ink:#e39a80; --btn:#d98a6f; --btn-press:#e5a48c; --btn-ink:#141413;
  --panel:#252320; --panel-line:#45423b; --panel-field:#1a1917;
  --chip-on:#d98a6f; --foot:#1f1e1b;
  --lift:0 1px 3px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:40px 48px;display:grid;gap:28px}
.skip{position:absolute;left:12px;top:-60px;z-index:10;background:var(--panel);color:var(--panel-ink);padding:10px 16px;border-radius:var(--r-sm);font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.05;margin:0;letter-spacing:-.025em;text-wrap:balance}
.sub{margin:10px 0 0;color:var(--muted);font-size:14px}
.count{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.other{color:var(--accent-ink);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;padding:6px 0}
.other:hover{text-decoration:underline;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}

/* Filtros */
.table{background:var(--panel);color:var(--panel-ink);border-radius:var(--r);padding:22px 24px 24px;display:grid;gap:16px}
.table h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2;letter-spacing:-.01em}
.thead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fmore{display:grid;gap:16px}
.ftoggle{display:none;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 14px;border:1px solid var(--panel-line);border-radius:999px;background:transparent;color:var(--panel-ink);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.nf{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--chip-on);color:var(--chip-on-ink);font-size:12px;font-weight:600;line-height:20px;text-align:center}
.chev{transition:transform .2s}
.ftoggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.frow{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flabel{font-size:13px;font-weight:500;color:var(--panel-soft);margin-right:6px}
.chip{border:1px solid var(--panel-line);background:transparent;color:var(--panel-ink);border-radius:999px;min-height:36px;padding:6px 14px;cursor:pointer;font-family:var(--body);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;min-width:40px;transition:background-color .15s,border-color .15s,transform .1s}
.chip:hover{border-color:var(--panel-soft)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.search{flex:1 1 220px;min-width:0;height:42px;background:var(--panel-field);border:1px solid var(--panel-line);border-radius:var(--r-sm);padding:0 14px;color:var(--panel-ink);transition:border-color .15s,box-shadow .15s}
.search::placeholder{color:var(--panel-soft)}
.table select{height:42px;background:var(--panel-field);border:1px solid var(--panel-line);border-radius:var(--r-sm);padding:0 10px;color:var(--panel-ink);max-width:100%}
.table select option{color:#141413;background:#faf9f5}
.search:focus-visible,.table select:focus-visible{outline:none;border-color:var(--chip-on);box-shadow:0 0 0 3px color-mix(in srgb,var(--chip-on) 30%,transparent)}

/* Rejilla */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px 20px}
.grid:focus{outline:none}
.box{position:relative;display:grid;grid-template-rows:auto 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;transition:box-shadow .2s,transform .2s,border-color .2s}
.cover{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--sunk);overflow:hidden}
.cover img{position:relative;width:100%;height:100%;object-fit:contain;background:var(--cover-bg);display:block}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#faf9f5}
.gen b{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.gen small{font-family:var(--mono);font-size:11px;opacity:.8}
.gen::after{content:"";position:absolute;inset:auto -18% -28% auto;width:66%;aspect-ratio:1;border-radius:50%;border:12px solid rgba(250,249,245,.14)}
.info{display:grid;gap:8px;align-content:start;padding:14px 16px 16px;min-width:0}
.info h3{margin:0;font-family:var(--display);font-weight:500;font-size:19px;line-height:1.2;letter-spacing:-.005em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta span{white-space:nowrap}
.weight{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.weight i{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted)}
.weight i.on{background:var(--accent);border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;font-weight:500;background:var(--sunk);border-radius:999px;padding:2px 10px;color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin-top:2px}
.foot a{color:var(--accent-ink);font-weight:600;text-decoration:none}
.foot a:hover{text-decoration:underline;text-underline-offset:3px}
.best{font-size:12.5px;color:var(--accent-ink);font-weight:600}
.best.soft{color:var(--muted);font-weight:400}

.exps{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:3px;font-size:13px}
.exps span{font-size:12px;font-weight:500;color:var(--muted)}
.exps a,.exps div{color:var(--ink);text-decoration:none}
.exps a:hover{text-decoration:underline;text-underline-offset:3px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty strong{color:var(--ink);font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:-.01em}
.btn{height:40px;padding:0 20px;border:0;border-radius:var(--r-sm);background:var(--btn);color:var(--btn-ink);font-size:14px;font-weight:500;cursor:pointer;transition:background-color .15s,transform .1s}
.btn:hover{background:var(--btn-press)}
.btn:active{transform:scale(.97)}

/* Esqueleto de carga */
.sk .cover{background:linear-gradient(100deg,var(--sunk) 40%,var(--surface) 50%,var(--sunk) 60%) 0 0/300% 100%;animation:sk 1.4s linear infinite}
.sk i{display:block;height:12px;border-radius:6px;background:var(--sunk)}
.sk i:first-child{height:18px;width:70%}
.sk i:last-child{width:45%}
@keyframes sk{to{background-position:-150% 0}}

/* Tarjeta clicable: el botón del título cubre la tarjeta; los enlaces quedan por encima */
.open{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.open::after{content:"";position:absolute;inset:0}
.open:focus-visible{outline:none}
.box:has(.open:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
@media (hover:hover){.box:has(.open):hover{border-color:color-mix(in srgb,var(--muted) 45%,var(--line));box-shadow:var(--lift);transform:translateY(-2px)}}
.foot a,.exps a{position:relative}
.vbadge{position:absolute;left:8px;bottom:8px;z-index:1;background:rgba(20,20,19,.78);color:#faf9f5;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;pointer-events:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Ficha */
body:has(.ficha[open]){overflow:hidden}
.ficha{width:min(780px,calc(100vw - 32px));max-width:none;max-height:calc(100dvh - 48px);padding:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);overflow:auto;overscroll-behavior:contain}
.ficha::backdrop{background:rgba(20,20,19,.55);backdrop-filter:blur(2px)}
.fbody{position:relative;padding:24px;display:grid;gap:24px;min-width:0}
.fclose{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:15px;line-height:1;transition:background-color .15s}
.fclose:hover{background:var(--sunk)}
.fhead{display:grid;grid-template-columns:168px minmax(0,1fr);gap:20px;align-items:start}
.fhead .cover{border-radius:var(--r-sm)}
.fhinfo{display:grid;gap:10px;min-width:0;padding-right:40px}
.fhinfo h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(26px,4.4vw,36px);line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.howto{display:grid;gap:12px;min-width:0}
.howhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.howhead h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:-.01em}
.nav{display:flex;gap:6px}
.nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:18px;line-height:1;transition:background-color .15s}
.nav button:hover:not(:disabled){background:var(--sunk)}
.nav button:disabled{opacity:.35;cursor:default}
.track{list-style:none;margin:0;padding:0 0 6px;display:grid;grid-auto-flow:column;grid-auto-columns:calc(50% - 6px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain}
.vid{scroll-snap-align:start;display:grid;gap:8px;align-content:start;min-width:0}
.vframe{position:relative;aspect-ratio:16/9;background:#181715;border-radius:var(--r-sm);overflow:hidden}
.vframe img,.vframe iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.play{position:absolute;inset:0;margin:auto;width:58px;height:40px;border:0;border-radius:var(--r-sm);background:rgba(20,20,19,.75);color:#faf9f5;font-size:17px;cursor:pointer;transition:background-color .15s}
.vframe:hover .play,.play:focus-visible{background:var(--chip-on);color:var(--chip-on-ink)}
.vt{margin:0;font-size:13.5px;line-height:1.4}
.vexp{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.novid{margin:0;color:var(--muted)}
.ffoot{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px;font-size:14px;text-align:left;color:var(--ink)}
.ffoot .exps{border:0;padding:0}
.flinks{display:flex;flex-wrap:wrap;gap:8px 20px}
.ficha a{color:var(--accent-ink);font-weight:600;text-decoration:none}
.ficha a:hover{text-decoration:underline;text-underline-offset:3px}
.ficha .exps a{color:var(--ink);font-weight:400}
.mine{font-size:12.5px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
.yo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-top:4px}
.played{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;transition:background-color .15s,transform .1s}
.played:hover{background:var(--sunk)}
.played:active{transform:scale(.97)}
.played[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.stars{display:inline-flex}
.stars button{background:none;border:0;padding:2px 3px;font-size:24px;line-height:1;color:color-mix(in srgb,var(--muted) 45%,transparent);cursor:pointer;transition:color .15s,transform .1s}
.stars button.on{color:var(--btn)}
.stars button:hover{transform:scale(1.15)}
.yo .hint{width:100%}
.ficha a.wa{justify-self:start;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;background:#25d366;color:#0b141a;font-weight:600;transition:background-color .15s,transform .1s}
.ficha a.wa:hover{background:#1ebe5a;text-decoration:none}
.ficha a.wa:active{transform:scale(.97)}
.pgn{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--muted)}
.pg{position:fixed;top:50%;z-index:3;width:48px;height:48px;margin-top:-24px;padding:0 0 3px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--lift);font-size:28px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s,transform .1s}
@media (hover:hover){.pg:hover{background:var(--sunk)}}
.pg:active{transform:scale(.94)}
.pg.prev{left:max(8px,calc(50% - 454px))}
.pg.next{right:max(8px,calc(50% - 454px))}
.ficha:not(.paged) .pg{display:none}
.fbody.from-next{animation:fin-r .22s ease-out}
.fbody.from-prev{animation:fin-l .22s ease-out}
@keyframes fin-r{from{opacity:0;transform:translateX(28px)}}
@keyframes fin-l{from{opacity:0;transform:translateX(-28px)}}
@media (max-width:520px){
  .ficha{width:100vw;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0}
  .fbody{padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .fclose{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))}
  .fhead{grid-template-columns:96px minmax(0,1fr);gap:12px}
  .ficha.paged .fbody{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  .pg{top:auto;margin:0;bottom:calc(16px + env(safe-area-inset-bottom));width:52px;height:52px;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .pg.prev{left:calc(16px + env(safe-area-inset-left))}
  .pg.next{right:calc(16px + env(safe-area-inset-right))}
  .track{grid-auto-columns:88%}
  .ficha .tags{display:flex}
}

.hint{font-size:12.5px;color:var(--muted);margin:0}
@media (max-width:520px){.wrap{padding-block:28px 32px;gap:22px}.table{padding:18px 16px 20px}.table h2{font-size:21px}.ftoggle{display:inline-flex}.table:not(.expanded) .fmore{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gen{padding:10px}.gen b{font-size:17px}.info{padding:10px 10px 12px;gap:6px}.info h3{font-size:16px}.meta{font-size:11.5px;gap:2px 8px}.box .tags,.box .hint{display:none}.foot{font-size:12px;flex-wrap:wrap}.table .btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.box:hover{transform:none!important}}

img{max-width:100%}
[hidden]{display:none!important}
.site-foot{background:var(--foot);color:var(--foot-ink);border-radius:var(--r);padding:22px 24px;font-size:13px;text-align:center}
.site-foot a{color:var(--foot-link);text-underline-offset:3px}
</style>
</head>
<body>
<a class="skip" href="#grid">Saltar a la colección</a>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Ludoteca de Diego y Alba</h1>
      <p class="sub"><span class="count" id="count">—</span> · datos de BoardGameGeek</p>
    </div>
    <a class="other" href="cuentos.html">Cuentos infantiles →</a>
  </header>

  <section class="table" aria-label="Filtros">
    <div class="thead">
      <h2>¿A qué jugamos hoy?</h2>
      <button class="ftoggle" id="ftoggle" type="button" aria-expanded="false" aria-controls="fmore">Filtros y orden<span class="nf" id="nf" hidden></span><span class="chev" aria-hidden="true">▾</span></button>
    </div>
    <div class="fmore" id="fmore">
    <div class="frow">
      <div class="fgroup" id="playersGroup" role="group" aria-label="Número de jugadores"><span class="flabel">Somos</span></div>
      <div class="fgroup" id="timeGroup" role="group" aria-label="Tiempo disponible"><span class="flabel">Tenemos</span></div>
      <div class="fgroup" id="ageGroup" role="group" aria-label="Edad del jugador más joven"><span class="flabel">El más peque tiene</span></div>
    </div>
    <div class="frow">
      <div class="fgroup" id="mineGroup" role="group" aria-label="Juegos que he jugado"><span class="flabel">Yo</span></div>
      <div class="fgroup" id="sortGroup" role="group" aria-label="Ordenar (pulsa otra vez para invertir)"><span class="flabel">Ordenar</span></div>
    </div>
    </div>
    <div class="frow">
      <input class="search" id="q" type="search" placeholder="Buscar por nombre o mecánica" aria-label="Buscar">
      <button class="btn" id="surprise" type="button" title="Abre un juego que no has jugado y que encaja con los filtros">🎲 Sorpréndeme</button>
    </div>
  </section>

  <main id="grid" class="grid" aria-live="polite" aria-busy="true" tabindex="-1"></main>
  <div id="emptyState" class="empty" hidden></div>
  <footer class="site-foot">Datos y portadas de <a href="https://boardgamegeek.com" target="_blank" rel="noopener">BoardGameGeek</a>.</footer>
</div>

<dialog id="ficha" class="ficha" aria-labelledby="fichaTitulo"><div class="fbody" id="fichaBody"></div><button class="pg prev" type="button" data-step="-1" aria-label="Juego anterior">‹</button><button class="pg next" type="button" data-step="1" aria-label="Juego siguiente">›</button></dialog>

<script>
const state = { games: [], players: null, time: null, age: null, mine: null, q: "", sort: "name", dir: 1, visible: [] };
const $ = id => document.getElementById(id);
const PLAYER_OPTS = [1,2,3,4,5,6,7,8];
const TIME_OPTS = [[30,"≤ 30 min"],[60,"≤ 1 h"],[120,"≤ 2 h"],[null,"Lo que haga falta"]];
const AGE_OPTS = [[6,"6"],[8,"8"],[10,"10"],[12,"12"],[14,"14"],[18,"Adultos"]];
const COVER_COLORS = ["#cc785c","#181715","#a9583e","#5e5d59","#8a6a4f"];
const MINE_OPTS = [[null,"Todos"],["p","Jugados"],["np","Sin jugar"]];
/* d: sentido del primer clic (1 = de menor a mayor); el segundo clic lo invierte */
const SORTS = {
  name:{l:"Nombre",d:1,v:g=>g.name,txt:["de la A a la Z","de la Z a la A"]},
  weight:{l:"Dificultad",d:1,v:g=>g.weight,txt:["de más fácil a más difícil","de más difícil a más fácil"]},
  time:{l:"Duración",d:1,v:g=>g.tmax||g.tmin,txt:["de más corto a más largo","de más largo a más corto"]},
  year:{l:"Año",d:-1,v:g=>g.year,txt:["de más antiguo a más nuevo","de más nuevo a más antiguo"]},
  rating:{l:"Nota BGG",d:-1,v:g=>g.rating,txt:["de peor a mejor nota","de mejor a peor nota"]},
  mine:{l:"Mi nota",d:-1,v:g=>mine(g.id).r,txt:["de peor a mejor nota mía","de mejor a peor nota mía"]}
};

/* Mis juegos: jugado (p) y valoración 1–5 (r), guardados solo en este navegador */
const MINE_KEY = "ludoteca:mis-juegos";
let mis = {};
try { mis = JSON.parse(localStorage.getItem(MINE_KEY)) || {}; } catch {}
const mine = id => mis[id] || {};
function saveMine(){ try { localStorage.setItem(MINE_KEY, JSON.stringify(mis)); } catch {} }
function setPlayed(id,on){ if(on) mis[id]={...mine(id),p:true}; else delete mis[id]; saveMine(); }
function setRating(id,r){ const m={...mine(id),p:true}; if(m.r===r) delete m.r; else m.r=r; mis[id]=m; saveMine(); }

function chips(){
  PLAYER_OPTS.forEach(n=>{
    const b=document.createElement("button"); b.className="chip"; b.type="button";
    b.textContent = n===8 ? "8+" : n; b.dataset.n=n;
    b.onclick=()=>{ state.players = state.players===n?null:n; render(); };
    $("playersGroup").appendChild(b);
  });
  TIME_OPTS.forEach(([v,l])=>{
    const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=l; b.dataset.v=String(v);
    b.onclick=()=>{ state.time=v; render(); };
    $("timeGroup").appendChild(b);
  });
  AGE_OPTS.forEach(([v,l])=>{
    const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=l; b.dataset.a=v;
    if(v<18) b.setAttribute("aria-label",`${v} años`);
    b.onclick=()=>{ state.age = state.age===v?null:v; render(); };
    $("ageGroup").appendChild(b);
  });
  MINE_OPTS.forEach(([v,l])=>{
    const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=l; b.dataset.m=String(v);
    b.onclick=()=>{ state.mine=v; render(); };
    $("mineGroup").appendChild(b);
  });
  Object.entries(SORTS).forEach(([k,s])=>{
    const b=document.createElement("button"); b.className="chip"; b.type="button"; b.dataset.k=k;
    b.onclick=()=>{ if(state.sort===k) state.dir=-state.dir; else { state.sort=k; state.dir=s.d; } render(); };
    $("sortGroup").appendChild(b);
  });
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hueOf(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return h; }
function coverHTML(g){
  const c = COVER_COLORS[(g.hue ?? hueOf(g.name||"?")) % COVER_COLORS.length];
  const bg = `linear-gradient(155deg,${c},color-mix(in srgb,${c} 72%,#000))`;
  const gen = `<div class="gen" style="background:${bg}"><small>${g.year||""}</small><b>${esc(g.name)}</b></div>`;
  const img = g.img ? `<img src="${esc(g.img)}" alt="Portada de ${esc(g.name)}" loading="lazy" decoding="async" onerror="this.remove()">` : "";
  return gen + img;
}
function weightHTML(w){
  if(!w) return "";
  const n=Math.round(w); let s='<span class="weight" aria-hidden="true">';
  for(let i=1;i<=5;i++) s+=`<i class="${i<=n?"on":""}"></i>`;
  return `<span title="Dificultad según BGG: ${w.toFixed(2)} sobre 5">Dificultad ${w.toFixed(1)}${s}</span></span>`;
}
function playersTxt(g){ if(!g.pmin) return ""; return g.pmin===g.pmax?`${g.pmin} jug.`:`${g.pmin}–${g.pmax} jug.`; }
function timeTxt(g){ if(!g.tmin&&!g.tmax) return ""; const a=g.tmin||g.tmax,b=g.tmax||g.tmin; return a===b?`${a} min`:`${a}–${b} min`; }
function fitsPlayers(g){ if(state.players==null) return true; if(!g.pmin) return false;
  const n=state.players; return n===8 ? g.pmax>=8 : (g.pmin<=n && g.pmax>=n); }
function fitsTime(g){ if(state.time==null) return true; const t=g.tmax||g.tmin; return t ? t<=state.time : false; }
function fitsAge(g){ if(state.age==null) return true; return g.age ? g.age<=state.age : false; }
function fitsQuery(g){ if(!state.q) return true;
  return [g.name,(g.tags||[]).join(" ")].join(" ").toLowerCase().includes(state.q.toLowerCase()); }
function fitsMine(g){ if(state.mine==null) return true; return state.mine==="p" ? !!mine(g.id).p : !mine(g.id).p; }
function sorted(list){
  const s=SORTS[state.sort], dir=state.dir;
  const byName=(a,b)=>a.name.localeCompare(b.name,"es",{ignorePunctuation:true});
  return [...list].sort((a,b)=>{
    if(state.sort==="name") return dir*byName(a,b);
    const x=s.v(a), y=s.v(b);
    if(x==null||y==null) return (x==null)-(y==null) || byName(a,b);  // sin dato, siempre al final
    return dir*(x-y) || byName(a,b);
  });
}
function mineHTML(g){
  const m=mine(g.id); if(!m.p) return "";
  return `<span class="mine" title="${m.r?`Lo he jugado · mi nota ${m.r} de 5`:"Lo he jugado"}">✓ Jugado${m.r?` · ${"★".repeat(m.r)}`:""}</span>`;
}
const short = n => n.replace(/^[^:]+:\s*/,"");

function render(){
  document.querySelectorAll("#playersGroup .chip").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.n===state.players)));
  document.querySelectorAll("#timeGroup .chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===String(state.time))));
  document.querySelectorAll("#ageGroup .chip").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.a===state.age)));
  document.querySelectorAll("#mineGroup .chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===String(state.mine))));
  document.querySelectorAll("#sortGroup .chip").forEach(b=>{
    const k=b.dataset.k, s=SORTS[k], on=k===state.sort;
    b.setAttribute("aria-pressed",String(on));
    b.textContent = on ? `${s.l} ${state.dir===1?"↑":"↓"}` : s.l;
    b.setAttribute("aria-label", on ? `Ordenado por ${s.l.toLowerCase()}, ${s.txt[state.dir===1?0:1]}. Pulsa para invertir` : `Ordenar por ${s.l.toLowerCase()}`);
  });
  const nf=[state.players,state.time,state.age,state.mine].filter(x=>x!=null).length;
  $("nf").hidden=!nf; $("nf").textContent=nf;
  $("ftoggle").setAttribute("aria-label",`Filtros y orden${nf?`, ${nf} filtro${nf===1?"":"s"} activo${nf===1?"":"s"}`:""}`);
  const ids=new Set(state.games.map(g=>g.id));
  const bases=state.games.filter(g=>!g.parent||!ids.has(g.parent));
  const exps={}; state.games.forEach(g=>{ if(g.parent&&ids.has(g.parent)) (exps[g.parent] ||= []).push(g); });
  const nExp=state.games.length-bases.length;
  const list=sorted(bases.filter(g=>fitsPlayers(g)&&fitsTime(g)&&fitsAge(g)&&fitsMine(g)&&(fitsQuery(g)||(exps[g.id]||[]).some(fitsQuery))));
  state.visible=list;
  const total=bases.length, expTxt=nExp?` + ${nExp} expansi${nExp===1?"ón":"ones"}`:"";
  $("count").textContent = list.length===total ? `${total} juegos${expTxt}` : `${list.length} de ${total} juegos`;
  $("grid").setAttribute("aria-busy","false");
  $("grid").innerHTML = list.map(g=>{
    const best = g.best ? (state.players===g.best ? `<span class="best">★ Ideal a ${g.best}</span>` : `<span class="best soft">Mejor a ${g.best}</span>`) : "";
    const tags=(g.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
    const ex=exps[g.id]||[];
    const nv=(g.videos||[]).length+ex.reduce((s,x)=>s+(x.videos||[]).length,0);
    return `<article class="box">
      <div class="cover">${coverHTML(g)}${nv?`<span class="vbadge">▶ ${nv} vídeo${nv===1?"":"s"}</span>`:""}</div>
      <div class="info">
        <h3><button class="open" type="button" data-id="${esc(g.id)}" aria-label="Ver ficha de ${esc(g.name)}">${esc(g.name)}</button></h3>
        <div class="meta">
          ${playersTxt(g)?`<span>${playersTxt(g)}</span>`:""}
          ${timeTxt(g)?`<span>${timeTxt(g)}</span>`:""}
          ${g.age?`<span>${g.age}+</span>`:""}
          ${weightHTML(g.weight)}
        </div>
        ${best}
        ${tags?`<div class="tags">${tags}</div>`:""}
        ${ex.length?`<div class="exps"><span>Expansiones</span>${ex.map(x=>x.bgg
          ?`<a href="https://boardgamegeek.com/boardgame/${encodeURIComponent(x.bgg)}" target="_blank" rel="noopener">+ ${esc(short(x.name))}</a>`
          :`<div>+ ${esc(short(x.name))}</div>`).join("")}</div>`:""}
        <div class="foot">
          ${g.bgg?`<a href="https://boardgamegeek.com/boardgame/${encodeURIComponent(g.bgg)}" target="_blank" rel="noopener">BGG${g.rating?` · ${g.rating.toFixed(1)}`:""} ↗</a>`:`<span class="hint">Sin ficha en BGG</span>`}
          ${mineHTML(g)}
        </div>
      </div></article>`;
  }).join("");
  const empty=$("emptyState");
  if(list.length===0){ empty.hidden=false; empty.innerHTML=`<strong>Ningún juego encaja</strong><span>Prueba con otro número de jugadores, más tiempo u otra edad.</span><button class="btn" type="button" data-clear>Quitar filtros</button>`; }
  else empty.hidden=true;
}
function clearFilters(){
  Object.assign(state,{players:null,time:null,age:null,mine:null,q:""}); $("q").value=""; render();
}
$("ftoggle").addEventListener("click",e=>{
  const open=$("ftoggle").getAttribute("aria-expanded")!=="true";
  $("ftoggle").setAttribute("aria-expanded",String(open)); document.querySelector(".table").classList.toggle("expanded",open);
});
$("surprise").addEventListener("click",e=>{
  const pool=state.visible.filter(g=>!mine(g.id).p), b=e.currentTarget;
  if(pool.length) return openGame(pool[Math.floor(Math.random()*pool.length)].id);
  b.textContent="Ya los has jugado todos"; setTimeout(()=>{ b.textContent="🎲 Sorpréndeme"; },2200);
});
$("emptyState").addEventListener("click",e=>{ if(e.target.closest("[data-clear]")) clearFilters(); });

/* Ficha del juego */
const ficha=$("ficha"), baseTitle=document.title;
const byId = id => state.games.find(g=>g.id===id);
const baseOf = g => (g.parent && byId(g.parent)) || g;
const expsOf = g => state.games.filter(x=>x.parent===g.id);
const bggUrl = id => `https://boardgamegeek.com/boardgame/${encodeURIComponent(id)}`;
const ytSearch = n => `https://www.youtube.com/results?search_query=${encodeURIComponent(n+" cómo se juega")}`;
const waUrl = g => `https://wa.me/?text=${encodeURIComponent(`${g.name} — ${location.origin}${location.pathname}#${encodeURIComponent(g.id)}`)}`;
const validYt =v => v && /^[\w-]{11}$/.test(v.yt);
function videosOf(g){
  return [...(g.videos||[]).filter(validYt).map(v=>({...v})),
    ...expsOf(g).flatMap(x=>(x.videos||[]).filter(validYt).map(v=>({...v,exp:short(x.name)})))];
}
function thumbHTML(yt,t){
  return `<img src="https://i.ytimg.com/vi/${yt}/hqdefault.jpg" alt="" loading="lazy" decoding="async"><button class="play" type="button" aria-label="Reproducir: ${esc(t)}">▶</button>`;
}
function yoHTML(g){
  const m=mine(g.id), stars=[1,2,3,4,5].map(i=>`<button type="button" data-r="${i}" class="${i<=(m.r||0)?"on":""}" aria-pressed="${m.r===i}" aria-label="Mi nota: ${i} de 5">★</button>`).join("");
  return `<button class="played" type="button" aria-pressed="${!!m.p}">${m.p?"✓ Lo he jugado":"Marcar como jugado"}</button>
    <span class="stars" role="group" aria-label="Mi valoración">${stars}</span>
    <span class="hint">Se guarda en este dispositivo</span>`;
}
function fichaHTML(g){
  const vids=videosOf(g), ex=expsOf(g);
  const meta=[playersTxt(g),timeTxt(g),g.age?`${g.age}+ años`:"",g.year?String(g.year):""].filter(Boolean).map(t=>`<span>${t}</span>`).join("");
  const nota=g.rating?`<span>Nota BGG ${g.rating.toFixed(1)}</span>`:"";
  const tags=(g.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const nav=vids.length>1?`<div class="nav"><button type="button" data-dir="-1" aria-label="Vídeo anterior">‹</button><button type="button" data-dir="1" aria-label="Vídeo siguiente">›</button></div>`:"";
  const howto=vids.length
    ?`<ul class="track" aria-label="Vídeos de cómo jugar">${vids.map(v=>`<li class="vid">
        <div class="vframe" data-yt="${v.yt}" data-t="${esc(v.t)}">${thumbHTML(v.yt,v.t)}</div>
        <p class="vt">${v.exp?`<span class="vexp">Expansión: ${esc(v.exp)}</span>`:""}${esc(v.t)}</p></li>`).join("")}</ul>`
    :`<p class="novid">Todavía no hay vídeos de este juego. <a href="${ytSearch(g.name)}" target="_blank" rel="noopener">Buscar «${esc(g.name)} cómo se juega» en YouTube ↗</a></p>`;
  return `<button class="fclose" type="button" aria-label="Cerrar ficha">✕</button>
    <header class="fhead">
      <div class="cover">${coverHTML(g)}</div>
      <div class="fhinfo">
        <span class="pgn"></span>
        <h2 id="fichaTitulo">${esc(g.name)}</h2>
        <div class="meta">${meta}${weightHTML(g.weight)}${nota}</div>
        ${g.best?`<span class="best">Mejor a ${g.best} jugadores</span>`:""}
        ${tags?`<div class="tags">${tags}</div>`:""}
        <div class="yo" id="yo">${yoHTML(g)}</div>
      </div>
    </header>
    <section class="howto" aria-labelledby="howtoTitulo">
      <div class="howhead"><h3 id="howtoTitulo">Cómo jugar</h3>${nav}</div>
      ${howto}
    </section>
    <footer class="ffoot">
      ${ex.length?`<div class="exps"><span>Expansiones</span>${ex.map(x=>x.bgg
        ?`<a href="${bggUrl(x.bgg)}" target="_blank" rel="noopener">+ ${esc(short(x.name))} ↗</a>`
        :`<div>+ ${esc(short(x.name))}</div>`).join("")}</div>`:""}
      <div class="flinks">
        ${g.bgg?`<a href="${bggUrl(g.bgg)}" target="_blank" rel="noopener">Ficha en BoardGameGeek ↗</a>`:""}
        <a href="${ytSearch(g.name)}" target="_blank" rel="noopener">Más vídeos en YouTube ↗</a>
      </div>
      <a class="wa" href="${waUrl(g)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.3Z"/></svg>Compartir por WhatsApp</a>
    </footer>`;
}
function updNav(){
  const t=ficha.querySelector(".track"), [prev,next]=ficha.querySelectorAll(".nav button");
  if(!t||!prev) return;
  prev.disabled=t.scrollLeft<=2;
  next.disabled=t.scrollLeft+t.clientWidth>=t.scrollWidth-2;
}
function stopVideos(except){
  ficha.querySelectorAll(".vframe.playing").forEach(f=>{ if(f===except) return;
    f.classList.remove("playing"); f.innerHTML=thumbHTML(f.dataset.yt,f.dataset.t); });
}
function play(f){
  stopVideos(f); f.classList.add("playing");
  f.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${f.dataset.yt}?autoplay=1&rel=0" title="${esc(f.dataset.t)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
}
function openGame(id,push=true,step=0){
  const g0=byId(id); if(!g0) return false;
  const g=baseOf(g0), hash="#"+encodeURIComponent(g.id);
  if(push){ if(location.hash!==hash) history.pushState({ficha:g.id},"",hash); }
  else if(location.hash!==hash) history.replaceState(history.state,"",hash);
  $("fichaBody").innerHTML=fichaHTML(g); ficha.dataset.id=g.id; pager(g.id,step);
  const t=ficha.querySelector(".track"); if(t) t.addEventListener("scroll",updNav,{passive:true});
  document.title=`${g.name} · ${baseTitle}`;
  if(!ficha.open) ficha.showModal();
  ficha.scrollTop=0; updNav();
  return true;
}
const closeFicha = () => { if(ficha.open) ficha.close(); };
ficha.addEventListener("close",()=>{
  stopVideos(); document.title=baseTitle;
  if(!location.hash) return;  // ya cerrada por "atrás"
  if(history.state&&history.state.ficha) history.back();
  else history.replaceState(null,"",location.pathname+location.search);
});
ficha.addEventListener("click",e=>{
  if(e.target===ficha) return closeFicha();  // clic en el fondo
  if(e.target.closest(".fclose")) return closeFicha();
  const pg=e.target.closest(".pg"); if(pg) return step(+pg.dataset.step);
  const p=e.target.closest(".play"); if(p) return play(p.closest(".vframe"));
  const pl=e.target.closest(".played"), st=e.target.closest(".stars button");
  if(pl||st){ const id=ficha.dataset.id;
    if(pl) setPlayed(id,pl.getAttribute("aria-pressed")!=="true"); else setRating(id,+st.dataset.r);
    const focus=pl?".played":`.stars button[data-r="${st.dataset.r}"]`;
    $("yo").innerHTML=yoHTML(byId(id)); $("yo").querySelector(focus).focus(); render(); return; }
  const d=e.target.closest(".nav button");
  if(d){ const t=ficha.querySelector(".track"), v=t.querySelector(".vid");
    t.scrollBy({left:+d.dataset.dir*(v.offsetWidth+12)}); }
});
addEventListener("popstate",()=>{
  const id=decodeURIComponent(location.hash.slice(1));
  if(!(id&&openGame(id,false))) closeFicha();
});
addEventListener("resize",updNav);
/* Pasar de ficha: recorre la lista que se está viendo (filtros y orden); vuelve al principio */
let navIds=[];
function navFor(id){
  const v=state.visible.map(x=>x.id);
  if(v.includes(id)) return v;
  return (ids=>state.games.filter(g=>!g.parent||!ids.has(g.parent)))(new Set(state.games.map(g=>g.id))).sort((a,b)=>a.name.localeCompare(b.name,"es")).map(x=>x.id);
}
function pager(id,step){
  if(!step||!navIds.includes(id)) navIds=navFor(id);
  const n=navIds.length, i=navIds.indexOf(id), name=k=>byId(navIds[(i+k+n)%n]).name;
  ficha.classList.toggle("paged",n>1);
  const c=ficha.querySelector(".pgn"); if(c){ c.hidden=n<2; c.textContent=`${i+1} / ${n}`; c.setAttribute("aria-label",`Juego ${i+1} de ${n}`); }
  if(n>1){ ficha.querySelector(".pg.prev").setAttribute("aria-label",`Juego anterior: ${name(-1)}`);
    ficha.querySelector(".pg.next").setAttribute("aria-label",`Juego siguiente: ${name(1)}`); }
  const fb=$("fichaBody"); fb.classList.remove("from-next","from-prev");
  if(step){ void fb.offsetWidth; fb.classList.add(step>0?"from-next":"from-prev"); }
}
function step(d){
  const n=navIds.length; if(!ficha.open||n<2) return;
  const i=navIds.indexOf(ficha.dataset.id);
  openGame(navIds[(i+d+n)%n],false,d);
}
ficha.addEventListener("keydown",e=>{
  if((e.key!=="ArrowLeft"&&e.key!=="ArrowRight")||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey) return;
  if(e.target.closest(".track,input,textarea,select")) return;
  e.preventDefault(); step(e.key==="ArrowRight"?1:-1);
});
let touch=null;  // deslizar el dedo; sobre el carrusel de vídeos no cuenta, ni cerca del borde (gesto "atrás" del sistema)
ficha.addEventListener("touchstart",e=>{ const t=e.touches[0];
  touch=e.touches.length===1&&!e.target.closest(".track")&&t.clientX>24&&t.clientX<innerWidth-24?[t.clientX,t.clientY]:null; },{passive:true});
ficha.addEventListener("touchend",e=>{ if(!touch) return;
  const t=e.changedTouches[0], dx=t.clientX-touch[0], dy=t.clientY-touch[1]; touch=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy)) step(dx<0?1:-1); },{passive:true});
$("grid").addEventListener("click",e=>{ const b=e.target.closest(".open"); if(b) openGame(b.dataset.id); });

$("q").addEventListener("input",e=>{ state.q=e.target.value.trim(); render(); });
chips();
$("grid").innerHTML='<div class="box sk" aria-hidden="true"><div class="cover"></div><div class="info"><i></i><i></i><i></i></div></div>'.repeat(8);
fetch("games.json",{cache:"no-cache"})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(data=>{ state.games=data; render();
    const id=decodeURIComponent(location.hash.slice(1)); if(id) openGame(id,false); })
  .catch(()=>{ $("grid").innerHTML=""; $("grid").setAttribute("aria-busy","false"); $("emptyState").hidden=false;
    $("emptyState").innerHTML="<strong>No se pudo cargar la colección</strong><span>Recarga la página en unos segundos.</span>"; });
</script>
</body>
</html>
